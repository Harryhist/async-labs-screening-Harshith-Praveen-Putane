<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="DeskView: an always-on smart calendar display for your desk.">
  <title>DeskView | Stop Missing Meetings</title>
  <style>
    :root {
      --navy: #1a1a2e;
      --deep-blue: #16213e;
      --cyan: #00d4ff;
      --cyan-deep: #0099cc;
      --white: #ffffff;
      --muted: #e0e0e0;
      --ink: #092331;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: auto;
      background:
        radial-gradient(circle at 50% 20%, rgba(0, 212, 255, 0.12), transparent 35%),
        #0d1225;
      color: var(--white);
      font-family: SF Pro Display, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .ad {
      position: relative;
      display: flex;
      width: min(100vw, 360px);
      aspect-ratio: 4 / 5;
      min-height: 0;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 28px 24px 24px;
      isolation: isolate;
      background:
        radial-gradient(circle at 86% 62%, rgba(0, 212, 255, 0.12), transparent 30%),
        linear-gradient(145deg, var(--navy), var(--deep-blue));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    .ad::before {
      position: absolute;
      z-index: -1;
      width: 220px;
      height: 220px;
      top: -116px;
      right: -92px;
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 50%;
      box-shadow: 0 0 0 28px rgba(0, 212, 255, 0.025), 0 0 0 56px rgba(0, 212, 255, 0.02);
      content: "";
    }

    .ad::after {
      position: absolute;
      z-index: -1;
      right: 0;
      bottom: 0;
      left: 0;
      height: 45%;
      opacity: 0.2;
      background-image: linear-gradient(rgba(0, 212, 255, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      -webkit-mask-image: linear-gradient(to top, black, transparent);
      mask-image: linear-gradient(to top, black, transparent);
      content: "";
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    .brand-mark {
      position: relative;
      display: inline-grid;
      width: 17px;
      height: 17px;
      place-items: center;
      border: 1px solid var(--cyan);
      border-radius: 5px;
      box-shadow: inset 0 0 8px rgba(0, 212, 255, 0.28);
    }

    .brand-mark::after {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 5px 0 var(--cyan), 0 5px var(--cyan), 5px 5px var(--cyan);
      content: "";
    }

    .hero {
      max-width: 285px;
      margin-top: 17px;
      animation: rise-in 700ms ease-out both;
    }

    h1 {
      max-width: 300px;
      margin: 0;
      color: var(--white);
      font-size: clamp(32px, 10vw, 38px);
      font-weight: 750;
      letter-spacing: -1.4px;
      line-height: 1.08;
    }

    h1 span {
      color: var(--cyan);
    }

    .kicker {
      margin: 10px 0 0;
      color: rgba(224, 224, 224, 0.72);
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .display-wrap {
      position: relative;
      display: grid;
      width: 100%;
      place-items: center;
      margin: 10px 0 9px;
      animation: rise-in 700ms 130ms ease-out both;
    }

    .display-wrap::after {
      position: absolute;
      z-index: -1;
      width: 77%;
      height: 18px;
      bottom: -2px;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.2);
      filter: blur(15px);
      content: "";
    }

    .display {
      width: 100%;
      max-width: 294px;
      padding: 12px;
      border: 1px solid rgba(0, 212, 255, 0.42);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.045));
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.18), 0 13px 30px rgba(0, 0, 0, 0.32), 0 0 24px rgba(0, 212, 255, 0.08);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transform: perspective(550px) rotateX(2deg);
    }

    .display-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .sync {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--cyan);
      font-size: 8px;
      letter-spacing: 0.4px;
    }

    .sync::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      content: "";
      animation: pulse 2.4s ease-in-out infinite;
    }

    .days,
    .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }

    .days {
      margin-bottom: 5px;
      color: rgba(224, 224, 224, 0.62);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .date {
      display: grid;
      min-height: 31px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 11px;
      font-weight: 650;
      background: rgba(255, 255, 255, 0.035);
    }

    .date.active {
      border-color: var(--cyan);
      color: var(--ink);
      background: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.32);
    }

    .event {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 7px 8px;
      border-left: 2px solid var(--cyan);
      border-radius: 4px;
      background: rgba(0, 212, 255, 0.1);
      color: var(--white);
      font-size: 9px;
      font-weight: 600;
    }

    .event-time {
      color: var(--cyan);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      animation: rise-in 700ms 260ms ease-out both;
    }

    .supporting {
      max-width: 177px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .supporting strong {
      display: block;
      margin-top: 5px;
      color: var(--white);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    .cta {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 17px;
      border: 0;
      border-radius: 7px;
      color: var(--ink);
      background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.1px;
      text-decoration: none;
      transition: filter 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .cta:hover {
      filter: brightness(1.1);
      box-shadow: 0 8px 22px rgba(0, 212, 255, 0.43);
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 3px;
    }

    .cta:active {
      transform: translateY(0);
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.65; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 359px) {
      .ad {
        padding: 23px 19px 20px;
      }

      .hero {
        margin-top: 12px;
      }

      .display {
        padding: 10px;
      }

      .display-wrap {
        margin-top: 6px;
        margin-bottom: 4px;
      }

      .date {
        min-height: 27px;
      }

      .footer {
        gap: 8px;
      }

      .supporting {
        font-size: 12px;
      }

      .cta {
        min-height: 40px;
        padding: 10px 13px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="ad" aria-label="DeskView smart calendar display advertisement">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> DeskView</div>
      <div class="hero">
        <h1>Stop Missing<br><span>Meetings.</span></h1>
        <p class="kicker">Your day, at a glance.</p>
      </div>
    </header>

    <section class="display-wrap" aria-label="Smart calendar display preview">
      <div class="display">
        <div class="display-top">
          <span>Tuesday · June 18</span>
          <span class="sync">Live sync</span>
        </div>
        <div class="days" aria-hidden="true">
          <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
        </div>
        <div class="dates" aria-label="Week of June 17 to June 23">
          <span class="date">17</span><span class="date active">18</span><span class="date">19</span><span class="date">20</span><span class="date">21</span><span class="date">22</span><span class="date">23</span>
        </div>
        <div class="event"><span class="event-time">10:30</span><span>Product sync</span></div>
      </div>
    </section>

    <footer class="footer">
      <p class="supporting">Your calendar. Always visible. Always on.<strong>7.5" e-paper · 30-day battery</strong></p>
      <a class="cta" href="#shop" aria-label="Shop DeskView now">Shop Now <span aria-hidden="true">→</span></a>
    </footer>
  </main>
</body>
</html>
